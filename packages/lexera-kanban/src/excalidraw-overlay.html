<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excalidraw Editor</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3efe6;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    #excalidraw-overlay-root {
      width: 100%;
      height: 100%;
    }
    #excalidraw-overlay-status {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(35, 35, 35, 0.82);
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    #excalidraw-overlay-status[data-state="ready"] {
      background: rgba(31, 88, 60, 0.82);
    }
    #excalidraw-overlay-status[data-state="error"] {
      background: rgba(128, 36, 36, 0.9);
      max-width: min(720px, calc(100vw - 32px));
      border-radius: 14px;
      white-space: normal;
      line-height: 1.4;
    }
  </style>
  <script src="excalidraw-overlay-bootstrap.js"></script>
  <script src="vendor/excalidraw/react.production.min.js"></script>
  <script src="vendor/excalidraw/react-dom.production.min.js"></script>
  <script src="vendor/excalidraw/excalidraw.production.min.js"></script>
  <script src="excalidraw-overlay.js"></script>
</head>
<body>
  <div id="excalidraw-overlay-status" data-state="loading">Loading Excalidraw…</div>
  <div id="excalidraw-overlay-root"></div>
</body>
</html>
