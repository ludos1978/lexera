        <div class="sidebar-dashboard-controls">

  <!-- Early error catcher — queues errors for the log viewer (drained by loggingSystem.js on DOMContentLoaded) -->
  <script>
  (function () {
    window.__lexeraEarlyErrors = [];
    function queueError(target, msg) {
      window.__lexeraEarlyErrors.push({
        timestampMs: Date.now(),
        level: 'error',
        target: target,
        message: msg
      });
    }
    window.onerror = function (msg, src, line, col) {
      var location = (src || '?') + ':' + line + ':' + col;
      queueError('window.error', 'Uncaught at ' + location + ': ' + msg);
    };
    window.onunhandledrejection = function (e) {
      var reason = e.reason;
      var detail = reason instanceof Error ? reason.message + '\n' + (reason.stack || '') : String(reason);
      queueError('window.unhandledrejection', 'Unhandled promise rejection: ' + detail);
    };
  })();
  </script>
