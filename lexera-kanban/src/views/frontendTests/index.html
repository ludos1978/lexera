<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Frontend Tests</title>
  <link rel="stylesheet" href="frontendTests.css">
</head>
<body>
  <header class="header">
    <span class="title">Frontend Tests</span>
    <span class="status" id="status">connecting</span>
  </header>
  <main class="body">
    <section class="summary-panel">
      <div class="summary-line" id="summary">Waiting for runner state…</div>
      <div class="summary-meta">
        <span id="progress">No run in progress</span>
        <span id="active-board">Board: none</span>
      </div>
    </section>

    <section class="controls">
      <button class="panel-btn primary" id="run-all" type="button">Run All</button>
      <button class="panel-btn" id="stop" type="button">Stop</button>
      <button class="panel-btn" id="clear" type="button">Clear</button>
      <select class="panel-select" id="copy-scope">
        <option value="all">Copy All</option>
        <option value="errors">Copy Errors</option>
        <option value="errors-with-logs">Copy Errors + Logs</option>
      </select>
      <button class="panel-btn" id="copy" type="button">Copy</button>
      <button class="panel-btn" id="refresh" type="button">Refresh</button>
    </section>

    <section>
      <h3>Categories</h3>
      <div class="category-list" id="categories"></div>
    </section>

    <section>
      <h3>Recent Results</h3>
      <div class="results-list" id="results"></div>
    </section>
  </main>

  <script src="../_shared/subAppRuntime.js"></script>
  <script src="frontendTests.js"></script>
</body>
</html>
