<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Backend Settings</title>
  <link rel="stylesheet" href="../../fonts.css">
  <link rel="stylesheet" href="../../tokens.css">
  <link rel="stylesheet" href="../../app.css">
  <link rel="stylesheet" href="../../management.css">
  <link rel="stylesheet" href="../../workspace/workspaceShell.css">
  <link rel="stylesheet" href="../_shared/panelShellFit.css">
  <link rel="stylesheet" href="../_shared/stub.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-primary, #1e1e1e);
      color: var(--text-primary, #d4d4d4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 12px;
    }
    .shell-settings-panel {
      width: 100%;
      height: 100vh;
      overflow-y: auto;
    }
    .shell-settings-container.view-loading::before {
      content: 'Loading…';
      display: block;
      padding: 12px;
      color: var(--text-muted, #888);
    }
  </style>
</head>
<body>
  <!-- Skeleton mirrors `sharedPanels.js → createBackendSettingsPanelElement`. -->
  <div class="shell-settings-panel lexera-shared-panel lexera-shared-panel-backend-settings"
       data-shell-panel="backendSettings" data-shell-panel-instance="backendSettings">
    <div class="shell-settings-container lexera-shared-backend-settings-container view-loading"
         id="mgmt-container"></div>
  </div>
  <script src="../../api.js"></script>
  <script src="../../management.js"></script>
  <script src="../_shared/subAppRuntime.js"></script>
  <script src="../_shared/settingsRuntime.js"></script>
  <script src="backendSettings.js"></script>
</body>
</html>
