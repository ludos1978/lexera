<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drag Ghost</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #5082dc;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      width: 100%; height: 100%;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #content {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 6px 10px; box-sizing: border-box;
      background: #5082dc;
      box-sizing: border-box;
    }
    .empty { color: rgba(255,255,255,0.7); font-style: italic; }
  </style>
</head>
<body>
  <div id="content"><span class="empty">drag ghost</span></div>
  <script>
    (function () {
      var contentEl = document.getElementById('content');
      try {
        var wv = window.__TAURI__.webview.getCurrentWebview();
        if (wv && typeof wv.listen === 'function') {
          wv.listen('ghost-content', function (event) {
            if (event && typeof event.payload === 'string') {
              contentEl.innerHTML = event.payload;
            }
          });
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
