<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-primary, #22222a); color: var(--text-primary, #e8e8ec);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px; overflow: hidden;
    }
    body {
      display: flex; flex-direction: column; padding: 16px 20px; box-sizing: border-box;
    }
    .title {
      font-weight: 600; font-size: 14px; margin-bottom: 8px;
      color: var(--text-primary, #fff);
    }
    .message {
      flex: 1 1 auto;
      color: var(--text-primary, #d8d8dc);
      line-height: 1.4;
      white-space: pre-wrap;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .buttons {
      display: flex; gap: 8px; justify-content: flex-end;
    }
    button {
      padding: 6px 14px;
      font-family: inherit; font-size: 12px;
      border-radius: 3px; cursor: pointer;
      border: 1px solid var(--border, #444);
    }
    button.primary {
      background: var(--accent, #007acc); color: #fff;
      border-color: var(--accent, #007acc);
    }
    button.secondary {
      background: var(--btn-bg, #3a3d41); color: var(--btn-fg, #e0e0e0);
    }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <header class="header" style="display:flex;align-items:center;margin:0 0 8px 0;">
    <span class="title" id="title" style="font-weight:600;font-size:14px;">Confirm</span>
  </header>
  <div class="message" id="message">Are you sure?</div>
  <script src="../_shared/healthDot.js"></script>
  <div class="buttons">
    <button class="secondary" id="btn-cancel">Cancel</button>
    <button class="primary" id="btn-ok">OK</button>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var label = params.get('label') || 'confirm';
      var title = params.get('title') || 'Confirm';
      var message = params.get('message') || 'Are you sure?';
      var okText = params.get('ok') || 'OK';
      var cancelText = params.get('cancel') || 'Cancel';

      document.getElementById('title').textContent = title;
      document.getElementById('message').textContent = message;
      var btnOk = document.getElementById('btn-ok');
      var btnCancel = document.getElementById('btn-cancel');
      btnOk.textContent = okText;
      btnCancel.textContent = cancelText;

      function emitResult(accepted) {
        var t = window.__TAURI__;
        if (t && t.event && typeof t.event.emit === 'function') {
          t.event.emit('modal-result-' + label, { accepted: accepted });
        }
        // Self-close
        if (t && t.core && typeof t.core.invoke === 'function') {
          t.core.invoke('multiview_close_window', { label: label }).catch(function () {});
        } else {
          window.close();
        }
      }

      btnOk.addEventListener('click', function () { emitResult(true); });
      btnCancel.addEventListener('click', function () { emitResult(false); });
      btnOk.focus();
      // Apply theme if main shell broadcasts (sub-app pattern)
      try {
        var wv = window.__TAURI__.webview.getCurrentWebview();
        if (wv && typeof wv.listen === 'function') {
          wv.listen('theme-snapshot', function (e) {
            if (!e || !e.payload || !e.payload.palette) return;
            var root = document.documentElement;
            Object.keys(e.payload.palette).forEach(function (k) {
              root.style.setProperty(k, e.payload.palette[k]);
            });
            if (e.payload.color_scheme) root.style.colorScheme = e.payload.color_scheme;
          });
          window.__TAURI__.core.invoke('multiview_broadcast', {
            event: 'theme-request', payload: {}
          }).catch(function () {});
        }
      } catch (_) {}

      // Escape cancels, Enter confirms
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { e.preventDefault(); emitResult(false); }
        if (e.key === 'Enter') { e.preventDefault(); emitResult(true); }
      });
    })();
  </script>
</body>
</html>
