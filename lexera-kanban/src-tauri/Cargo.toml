[package]
name = "lexera-kanban"
version = "0.1.0"
edition = "2021"

[dependencies]
lexera-core = { path = "../../lexera-core" }
lexera-local-ipc = { path = "../../lexera-local-ipc" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
clipboard-rs = "0.2"
base64 = "0.22"
rfd = "0.15"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
